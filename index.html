<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="تطبيق إدارة المصروفات - يعمل بدون إنترنت" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>مصروفي | إدارة المصروفات</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0ea5e9" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="مصروفي" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================================================
     واجهة التطبيق
     ============================================================ -->
<div id="screen-app" class="screen screen--active">

  <!-- الشريط العلوي -->
  <header class="appbar">
    <div class="appbar__title">
      <span id="appbar-title">الرئيسية</span>
      <small id="appbar-sub">مصروفي</small>
    </div>
    <div class="appbar__actions">
      <span id="net-badge" class="badge badge--off">غير متصل</span>
      <button id="btn-sync" class="icon-btn" type="button" title="مزامنة الآن">⟳</button>
      <button id="btn-theme" class="icon-btn" type="button" title="تبديل الوضع">🌙</button>
    </div>
  </header>

  <!-- المحتوى -->
  <main id="views" class="views">

    <!-- ============ عرض: الرئيسية ============ -->
    <section id="view-dashboard" class="view view--active">

      <div class="card">
        <div class="row">
          <label class="field field--grow">
            <span class="field__label">اسم الشخص</span>
            <select id="person-select"></select>
          </label>
          <button id="btn-add-person" class="icon-btn icon-btn--square" type="button"
                  title="إضافة شخص">＋</button>
        </div>
      </div>

      <div class="card balance-card">
        <div class="balance-card__label">المبلغ المتبقي</div>
        <div class="balance-card__value" id="stat-balance">0.00</div>
        <div class="balance-card__grid">
          <div class="balance-card__item">
            <span>المبلغ الافتتاحي</span>
            <strong id="stat-opening">0.00</strong>
          </div>
          <div class="balance-card__item">
            <span>إجمالي الإيرادات</span>
            <strong id="stat-income" class="pos">0.00</strong>
          </div>
          <div class="balance-card__item">
            <span>إجمالي المصروفات</span>
            <strong id="stat-expense" class="neg">0.00</strong>
          </div>
        </div>
      </div>

      <form id="tx-form" class="card" autocomplete="off">
        <h2 class="card__title">معاملة جديدة</h2>

        <div class="segmented" id="tx-type-switch">
          <button type="button" class="segmented__btn is-active" data-type="إيراد">إيراد</button>
          <button type="button" class="segmented__btn" data-type="مصروف">مصروف</button>
        </div>
        <input type="hidden" id="tx-type" value="إيراد" />

        <label class="field">
          <span class="field__label">القيمة</span>
          <input id="tx-amount" type="number" inputmode="decimal" step="0.01" min="0.01"
                 required placeholder="0.00" />
        </label>

        <label class="field">
          <span class="field__label">ملاحظات</span>
          <input id="tx-notes" type="text" maxlength="120" placeholder="وصف مختصر (اختياري)" />
        </label>

        <label class="field">
          <span class="field__label">التاريخ والوقت</span>
          <input id="tx-datetime" type="datetime-local" required />
        </label>

        <button class="btn btn--primary btn--block" type="submit">حفظ المعاملة</button>
      </form>

      <div class="card">
        <h2 class="card__title">نظرة عامة</h2>
        <div class="chart-wrap" id="chart-wrap">
          <canvas id="chart-overview" aria-label="رسم بياني للإيرادات والمصروفات"></canvas>
        </div>
        <div id="chart-fallback" class="chart-fallback" hidden></div>
      </div>
    </section>

    <!-- ============ عرض: المعاملات ============ -->
    <section id="view-transactions" class="view">
      <div class="card">
        <div class="row">
          <label class="field field--grow">
            <span class="field__label">الشخص</span>
            <select id="tx-filter-person"><option value="">الكل</option></select>
          </label>
          <label class="field field--grow">
            <span class="field__label">النوع</span>
            <select id="tx-filter-type">
              <option value="">الكل</option>
              <option value="إيراد">إيراد</option>
              <option value="مصروف">مصروف</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span class="field__label">بحث</span>
          <input id="tx-search" type="search" placeholder="بحث في الملاحظات أو الأسماء..." />
        </label>
      </div>

      <div id="tx-list" class="tx-list"></div>
    </section>

    <!-- ============ عرض: التقارير ============ -->
    <section id="view-reports" class="view">
      <div class="card">
        <div class="segmented" id="report-period">
          <button type="button" class="segmented__btn is-active" data-period="daily">يومي</button>
          <button type="button" class="segmented__btn" data-period="weekly">أسبوعي</button>
          <button type="button" class="segmented__btn" data-period="monthly">شهري</button>
          <button type="button" class="segmented__btn" data-period="yearly">سنوي</button>
        </div>
        <label class="field">
          <span class="field__label">اسم الشخص</span>
          <select id="report-person"><option value="">الكل</option></select>
        </label>
        <p class="hint" id="report-range"></p>
      </div>

      <div class="card">
        <h2 class="card__title">ملخص الفترة</h2>
        <div class="report-summary" id="report-summary"></div>
      </div>

      <div class="card">
        <h2 class="card__title">التفصيل</h2>
        <div id="report-table" class="report-table"></div>
      </div>

      <button id="btn-export-csv" class="btn btn--ghost btn--block" type="button">
        تصدير التقرير (CSV)
      </button>
    </section>

    <!-- ============ عرض: الإعدادات ============ -->
    <section id="view-settings" class="view">

      <div class="card">
        <h2 class="card__title">المزامنة مع Google Sheets</h2>
        <label class="field">
          <span class="field__label">رابط تطبيق Google Apps Script (Web App URL)</span>
          <input id="set-script-url" type="url" dir="ltr"
                 placeholder="https://script.google.com/macros/s/.../exec" />
        </label>
        <label class="field">
          <span class="field__label">رمز الحماية (Token) — اختياري</span>
          <input id="set-script-token" type="text" dir="ltr" placeholder="SYNC_TOKEN" />
        </label>
        <label class="checkbox">
          <input id="set-auto-sync" type="checkbox" checked />
          <span>مزامنة تلقائية عند توفر الإنترنت</span>
        </label>
        <div class="row row--gap">
          <button id="btn-sync-now" class="btn btn--primary field--grow" type="button">مزامنة الآن</button>
          <button id="btn-sync-test" class="btn btn--ghost field--grow" type="button">اختبار الاتصال</button>
        </div>
        <p class="hint" id="sync-info">لم تتم المزامنة بعد.</p>
      </div>

      <div class="card">
        <h2 class="card__title">إدارة الأشخاص</h2>
        <div id="people-list" class="list"></div>
        <button id="btn-add-person-2" class="btn btn--ghost btn--block" type="button">إضافة شخص</button>
      </div>

      <div class="card">
        <h2 class="card__title">البيانات</h2>
        <div class="row row--gap">
          <button id="btn-export-json" class="btn btn--ghost field--grow" type="button">نسخة احتياطية</button>
          <button id="btn-import-json" class="btn btn--ghost field--grow" type="button">استيراد</button>
        </div>
        <input id="import-file" type="file" accept="application/json" hidden />
        <button id="btn-reset" class="btn btn--danger btn--block" type="button">حذف كل البيانات</button>
      </div>
    </section>
  </main>

  <!-- شريط التنقل السفلي -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar__btn is-active" data-view="dashboard" type="button">
      <span class="tabbar__icon">🏠</span><span>الرئيسية</span>
    </button>
    <button class="tabbar__btn" data-view="transactions" type="button">
      <span class="tabbar__icon">📋</span><span>المعاملات</span>
    </button>
    <button class="tabbar__btn" data-view="reports" type="button">
      <span class="tabbar__icon">📊</span><span>التقارير</span>
    </button>
    <button class="tabbar__btn" data-view="settings" type="button">
      <span class="tabbar__icon">⚙️</span><span>الإعدادات</span>
    </button>
  </nav>
</div>

<!-- النافذة المنبثقة -->
<div id="modal" class="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title" class="modal__title"></h3>
    <form id="modal-form">
      <div id="modal-body" class="modal__body"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-close>إلغاء</button>
        <button type="submit" class="btn btn--primary" id="modal-submit">حفظ</button>
      </div>
    </form>
  </div>
</div>

<!-- التنبيهات العابرة -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
<script>
  // تسجيل Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ Service Worker مسجّل:', reg.scope))
        .catch(err => console.warn('❌ فشل تسجيل SW:', err));
    });
  }
</script>
</body>
</html>
